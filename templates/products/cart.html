<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Shopping Cart</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial;
}

body{
background:#f2f2f2;
}

h1{
text-align:center;
margin:30px;
}

.container{
width:90%;
margin:auto;
}

.cart-item{

display:flex;
justify-content:space-between;
align-items:center;
background:white;
padding:20px;
margin-bottom:20px;
border-radius:10px;
box-shadow:0 5px 10px rgba(0,0,0,.15);

}

.left{

display:flex;
align-items:center;

}

.left img{

width:120px;
height:120px;
object-fit:cover;
margin-right:20px;
border-radius:10px;

}

.info h2{

margin-bottom:10px;

}

.info p{

margin:5px 0;

}

.price{

color:green;
font-size:22px;
font-weight:bold;

}

.quantity{

margin-top:10px;

}

.delete{

background:red;
color:white;
padding:10px 20px;
border:none;
border-radius:5px;
cursor:pointer;

}

.delete:hover{

background:darkred;

}

.summary{

background:white;
padding:20px;
border-radius:10px;
box-shadow:0 5px 10px rgba(0,0,0,.15);
text-align:right;

}

.checkout{

background:green;
color:white;
padding:12px 25px;
border:none;
margin-top:15px;
border-radius:5px;
cursor:pointer;

}

.checkout:hover{

background:darkgreen;

}

.empty{

text-align:center;
font-size:25px;
margin-top:100px;

}

</style>

</head>

<body>

<h1>Shopping Cart</h1>

<div class="container">

{% for item in cart_items %}

<div class="cart-item">

<div class="left">

<img src="{{ item.product.image.url }}" alt="{{ item.product.name }}">

<div class="info">

<h2>{{ item.product.name }}</h2>

<p class="price">₹{{ item.product.price }}</p>

<p class="quantity">Quantity : {{ item.quantity }}</p>

</div>

</div>

<a href="{% url 'delete_cart' item.id %}">
<button class="delete">Delete</button>
</a>

</div>

{% empty %}

<div class="empty">

Your Cart is Empty

</div>

{% endfor %}

<div class="summary">

<h2>Total : ₹{{ total }}</h2>

<button class="checkout">Proceed to Checkout</button>

</div>

</div>

</body>
</html>
