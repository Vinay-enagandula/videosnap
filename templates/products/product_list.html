<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Product Store</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial, Helvetica, sans-serif;
}

body{
    background:#f4f4f4;
}

h1{
    text-align:center;
    margin:30px 0;
    color:#333;
}

.container{
    width:90%;
    margin:auto;
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(250px,1fr));
    gap:25px;
}

.card{
    background:#fff;
    border-radius:10px;
    box-shadow:0 5px 15px rgba(0,0,0,.15);
    overflow:hidden;
    transition:.3s;
}

.card:hover{
    transform:translateY(-5px);
}

.card img{
    width:100%;
    height:220px;
    object-fit:cover;
}

.content{
    padding:20px;
}

.content h2{
    margin-bottom:10px;
}

.price{
    color:green;
    font-size:25px;
    font-weight:bold;
    margin:15px 0;
}

button{
    width:100%;
    background:#007bff;
    color:white;
    border:none;
    padding:12px;
    border-radius:5px;
    cursor:pointer;
    font-size:16px;
}

button:hover{
    background:#0056b3;
}

.cart-btn{
    margin-top:20px;
    text-align:center;
}

.cart-btn a{
    text-decoration:none;
    background:#28a745;
    color:white;
    padding:12px 25px;
    border-radius:5px;
}

</style>

</head>
<body>

<h1>Product Store</h1>

<div class="container">

{% for product in products %}

<div class="card">

<img src="{{ product.image.url }}" alt="{{ product.name }}">

<div class="content">

<h2>{{ product.name }}</h2>

<p>{{ product.description }}</p>

<div class="price">₹{{ product.price }}</div>

<a href="{% url 'add_to_cart' product.id %}">
<button>Add to Cart</button>
</a>

</div>

</div>

{% endfor %}

</div>

<div class="cart-btn">

<a href="{% url 'cart' %}">View Cart</a>

</div>

</body>
</html>
