<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>404 - Page Not Found</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial,sans-serif;
}

body{
    background:#f4f6f9;
    display:flex;
    justify-content:center;
    align-items:center;
    height:100vh;
}

.container{
    text-align:center;
    background:white;
    padding:50px;
    border-radius:10px;
    box-shadow:0 5px 15px rgba(0,0,0,.2);
    width:90%;
    max-width:600px;
}

h1{
    font-size:100px;
    color:#0a66c2;
}

h2{
    margin:15px 0;
}

p{
    color:#555;
    margin-bottom:25px;
}

a{
    text-decoration:none;
    background:#0a66c2;
    color:white;
    padding:12px 30px;
    border-radius:5px;
    transition:.3s;
}

a:hover{
    background:#084d94;
}
</style>

</head>
<body>

<div class="container">

<h1>404</h1>

<h2>Oops! Page Not Found</h2>

<p>
The page you're looking for doesn't exist or has been moved.
</p>

<a href="index.html">Return Home</a>

</div>

</body>
</html>
