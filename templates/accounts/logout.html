<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Logged Out</title>

    <style>
        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
            font-family:Arial, Helvetica, sans-serif;
        }

        body{
            background:#f4f4f4;
            display:flex;
            justify-content:center;
            align-items:center;
            height:100vh;
        }

        .container{
            background:white;
            padding:40px;
            border-radius:10px;
            box-shadow:0 5px 15px rgba(0,0,0,0.2);
            text-align:center;
            width:400px;
        }

        h2{
            color:#28a745;
            margin-bottom:15px;
        }

        p{
            color:#555;
            margin-bottom:25px;
        }

        .btn{
            display:inline-block;
            padding:12px 25px;
            margin:8px;
            text-decoration:none;
            color:white;
            border-radius:5px;
            transition:0.3s;
        }

        .login{
            background:#007bff;
        }

        .login:hover{
            background:#0056b3;
        }

        .home{
            background:#28a745;
        }

        .home:hover{
            background:#1e7e34;
        }
    </style>
</head>
<body>

    <div class="container">
        <h2>✅ You have been logged out</h2>
        <p>Thank you for visiting. We hope to see you again!</p>

        <a href="{% url 'login' %}" class="btn login">Login Again</a>
        <a href="{% url 'index' %}" class="btn home">Go to Home</a>
    </div>

</body>
</html>
